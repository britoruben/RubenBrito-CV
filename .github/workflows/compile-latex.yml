name: Compile LaTeX to PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'main.tex'
      - '.github/workflows/compile-latex.yml'
  workflow_dispatch:

concurrency:
  group: compile-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PDF_PUSH_TOKEN }}

    - name: Compile LaTeX to PDF
      uses: xu-cheng/latex-action@v3
      with:
        root_file: main.tex
        latexmk_use_xelatex: true
        work_in_root_directory: true

    - name: Move PDF to docs folder
      run: |
        mkdir -p docs
        if [ -f "main.pdf" ]; then
          mv main.pdf docs/RubenBrito-CV.pdf
        fi

    - name: Install poppler-utils
      run: sudo apt-get update && sudo apt-get install -y poppler-utils

    - name: Generate PDF page-1 thumbnail
      run: |
        if [ -f "docs/RubenBrito-CV.pdf" ]; then
          pdftoppm -png -r 60 -singlefile docs/RubenBrito-CV.pdf docs/assets/cv-preview
        fi

    - name: Commit and push PDF
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if [ -f "docs/RubenBrito-CV.pdf" ]; then
          git add docs/RubenBrito-CV.pdf
          [ -f docs/assets/cv-preview.png ] && git add docs/assets/cv-preview.png

          if ! git diff --cached --quiet; then
            git commit -m "ci: update CV PDF from LaTeX [skip ci]"
            git push
          fi
        fi
